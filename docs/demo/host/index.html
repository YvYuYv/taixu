<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Taixu 宿主 · wujie 示例改造版</title>
    <script type="module" crossorigin src="./assets/index-D8Toimgn.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-Of3naTq9.css">
  </head>
  <body>
    <header>
      <h1>Taixu 微前端 · wujie 示例改造版</h1>
      <p>宿主 = <code>@taixu/core</code>（框架无关壳）· 子应用独立构建 ESM · 运行时集成 · 保活切换 · 跨技术栈共享状态</p>
    </header>
    <nav id="menu">
      <button data-app="react17" class="active">React17</button>
      <button data-app="vue3">Vue3</button>
      <button data-app="vite">Vite(Vue3)</button>
      <button data-app="all">全部（多槽位）</button>
    </nav>
    <main>
      <section id="slot-main-wrap">
        <h3>main 槽位</h3>
        <div id="outlet-main"></div>
      </section>
      <section id="slot-side-wrap" hidden>
        <h3>side 槽位（多槽位共存）</h3>
        <div id="outlet-side"></div>
      </section>
      <section id="shared-panel">
        <h3>跨应用共享购物车（state shared 键空间）</h3>
        <ul id="cart-list"></ul>
        <p id="cart-total">合计 0 件</p>
      </section>
      <section id="log-panel">
        <h3>事件流（app/* · bus/* · security/* 旁听）</h3>
        <ul id="flow"></ul>
      </section>
    </main>
  </body>
</html>
