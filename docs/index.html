<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Taixu - 基于 Cordis 的微前端框架</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="description" content="Taixu：基于 Cordis IoC 的微前端框架——沙箱、样式隔离、保活、路由矩阵、共享依赖仲裁、SSR 水合">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root {
      --theme-color: #4a6cf7;
    }
    .markdown-section h1 { font-weight: 600; }
    .markdown-section h2 { border-bottom: 1px solid #eee; padding-bottom: .3rem; }
    .sidebar > h1 { font-size: 1.4rem; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; background: #eef1ff; color: #4a6cf7; margin-right: 6px; }
    /* navbar 下拉菜单（docsify 主题不带，自行补充） */
    .app-nav > ul > li { position: relative; }
    .app-nav li > ul {
      display: none;
      position: absolute;
      top: 100%;
      right: 0;
      min-width: 190px;
      padding: 6px 0;
      margin: 0;
      list-style: none;
      background: #fff;
      border: 1px solid #eee;
      border-radius: 6px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, .1);
      z-index: 999;
    }
    .app-nav li:hover > ul { display: block; }
    .app-nav li > ul li { display: block; margin: 0; }
    .app-nav li > ul li a {
      display: block;
      padding: 7px 18px;
      margin: 0;
      border-bottom: none;
      font-size: 14px;
      white-space: nowrap;
    }
    .app-nav li > ul li a:hover {
      color: var(--theme-color, #4a6cf7);
      background: #f5f7ff;
    }
  </style>
</head>
<body>
  <div id="app">加载中…</div>
  <script>
    window.$docsify = {
      name: 'Taixu',
      repo: 'taixu-micro/taixu',
      loadSidebar: true,
      loadNavbar: true,
      subMaxLevel: 3,
      maxLevel: 4,
      auto2top: true,
      search: {
        placeholder: '搜索文档…',
        noData: '没有找到相关结果',
        depth: 3,
      },
      alias: {
        '/specs/(.*)': 'https://raw.githubusercontent.com/YvYuYv/taixu/main/docs/specs/$1',
      },
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-typescript.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
</body>
</html>
