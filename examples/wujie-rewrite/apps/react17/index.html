<!doctype html>
<html lang="zh-CN">
  <head><meta charset="UTF-8" /><title>react17 子应用独立预览</title>
  <link rel="stylesheet" href="../../host/style.css" /></head>
  <body>
    <h3>react17 子应用独立预览（app.mjs 的 default export 是 taixu Plugin，由宿主运行时加载）</h3>
    <div id="app"></div>
    <script type="module">
      // 独立预览：本页面仅用于人工核对子应用产物；正式消费在宿主 main 槽位
      import('@taixu/core').then(async ({ createLiteRuntime, defineApp }) => {
        const plugin = (await import('./app.mjs')).default
        document.getElementById('app').textContent = '插件对象已加载: ' + plugin.name
      })
    </script>
  </body>
</html>
